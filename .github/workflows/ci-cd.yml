name: CI/CD — Kitob Bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # 1. TEST
  # ─────────────────────────────────────────
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Python 3.11 o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Tesseract o'rnatish (OCR uchun)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-rus tesseract-ocr-uzb

      - name: Kutubxonalar o'rnatish
        run: pip install -r requirements.txt

      - name: Modullar import testi
        run: |
          python -c "
          from storage import Storage
          from ocr import extract_text
          from analyzer import analyze_text
          from linker import find_related
          print('✅ Barcha modullar import qilindi')
          "

      - name: Storage testi
        run: |
          python -c "
          import os
          os.environ['DB_PATH'] = '/tmp/test.db'
          from storage import Storage
          s = Storage()
          book_id = s.add_book(1, 'Test kitob', 'file123', 'pdf', 1024, 'test.pdf')
          assert book_id == 1
          book = s.get_book(1, book_id)
          assert book['title'] == 'Test kitob'
          s.save_analysis(book_id, {
              'keywords': ['soliq', 'daromad'],
              'topics': ['moliya'],
              'summary': 'Test xulosa',
              'language': 'uzbek_latin',
              'raw_text': 'soliq daromad moliya'
          })
          book = s.get_book(1, book_id)
          assert book['analyzed'] == 1
          s.delete_book(1, book_id)
          assert s.get_book_count(1) == 0
          print('✅ Storage testlari o\'tdi')
          "

      - name: Analyzer testi
        run: |
          python -c "
          from analyzer import analyze_text
          text = 'Soliq tizimi va daromad solig\\'i. QQS va aksiz soliqlari. Byudjet to\\'lovlari.'
          result = analyze_text(text, 'Soliq qollanmasi')
          assert isinstance(result['keywords'], list)
          assert isinstance(result['topics'], list)
          assert isinstance(result['summary'], str)
          assert len(result['keywords']) > 0
          print('✅ Analyzer testi o\\'tdi')
          print('   Kalit so\\'zlar:', result['keywords'][:5])
          print('   Til:', result['language'])
          "

      - name: Linker testi
        run: |
          python -c "
          from linker import find_related
          book1 = {
              'id': 1, 'title': 'Soliq qollanmasi',
              'keywords': ['soliq', 'daromad', 'stavka', 'tolov'],
              'topics': ['soliq', 'moliya'],
              'raw_text': 'soliq daromad tolov stavka byudjet'
          }
          new_book = {
              'keywords': ['soliq', 'byudjet', 'stavka', 'isloh'],
              'topics': ['soliq', 'byudjet'],
              'raw_text': 'soliq byudjet stavka isloh daromad'
          }
          related = find_related(new_book, [book1])
          assert len(related) > 0
          assert related[0]['score'] > 0
          print('✅ Linker testi o\\'tdi')
          print('   O\\'xshashlik:', related[0]['score'])
          "

      - name: OCR modul testi
        run: |
          python -c "
          import tempfile, os
          from ocr import extract_text, _extract_txt

          # TXT fayl testi
          with tempfile.NamedTemporaryFile(mode='w', suffix='.txt', delete=False, encoding='utf-8') as f:
              f.write('Soliq qonunchiligi. Daromad solighi va QQS.')
              path = f.name
          text = extract_text(path, 'txt')
          os.unlink(path)
          assert 'Soliq' in text
          print('✅ OCR (txt) testi o\\'tdi')
          "

  # ─────────────────────────────────────────
  # 2. DEPLOY (faqat main ga push bo'lganda)
  # ─────────────────────────────────────────
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: SSH orqali serverga ulash va deploy qilish
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd ~/soliq-bot

            echo "📥 Yangi kod yuklanmoqda..."
            git pull origin main

            echo "📦 Kutubxonalar yangilanmoqda..."
            pip install -r requirements.txt --quiet --break-system-packages

            echo "🔄 Bot qayta ishga tushirilmoqda..."
            # systemd service bo'lsa:
            sudo systemctl restart soliq-bot || true

            # yoki pm2 bo'lsa:
            # pm2 restart soliq-bot || pm2 start bot.py --name soliq-bot

            echo "✅ Deploy muvaffaqiyatli!"

      - name: Deploy natijasini Telegram ga yuborish
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_NOTIFY_TOKEN }}
          message: |
            ${{ job.status == 'success' && '✅' || '❌' }} *Kitob Bot Deploy*

            📌 Branch: `${{ github.ref_name }}`
            👤 Kim: ${{ github.actor }}
            💬 Commit: ${{ github.event.head_commit.message }}
            🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
