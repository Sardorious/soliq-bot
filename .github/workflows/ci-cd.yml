name: CI/CD — Kitob Bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Python 3.11 o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Tesseract o'rnatish
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-rus tesseract-ocr-uzb

      - name: Kutubxonalar o'rnatish
        run: pip install -r requirements.txt

      - name: Modullar import testi
        working-directory: ${{ github.workspace }}
        run: python -c "from storage import Storage; from ocr import extract_text; from analyzer import analyze_text; from linker import find_related; print('OK')"

      - name: Storage testi
        working-directory: ${{ github.workspace }}
        run: |
          DB_PATH=/tmp/test.db python -c "
          from storage import Storage
          s = Storage()
          bid = s.add_book(1, 'Test kitob', 'file123', 'pdf', 1024, 'test.pdf')
          assert s.get_book(1, bid)['title'] == 'Test kitob'
          s.save_analysis(bid, {'keywords': ['soliq'], 'topics': ['moliya'], 'summary': 'test', 'language': 'uzbek_latin', 'raw_text': 'soliq'})
          assert s.get_book(1, bid)['analyzed'] == 1
          s.delete_book(1, bid)
          print('Storage OK')
          "

      - name: Analyzer testi
        working-directory: ${{ github.workspace }}
        run: |
          python -c "
          from analyzer import analyze_text
          r = analyze_text('Soliq tizimi va daromad solighi. QQS va aksiz soliqlari.', 'Test')
          assert len(r['keywords']) > 0
          print('Analyzer OK, kalit sozlar:', r['keywords'][:5])
          "

      - name: Linker testi
        working-directory: ${{ github.workspace }}
        run: |
          python -c "
          from linker import find_related
          b1 = {'id':1,'title':'Kitob','keywords':['soliq','daromad','stavka','tolov'],'topics':['soliq','moliya'],'raw_text':'soliq daromad tolov stavka'}
          n  = {'keywords':['soliq','byudjet','stavka','isloh'],'topics':['soliq','byudjet'],'raw_text':'soliq byudjet stavka isloh'}
          r = find_related(n, [b1])
          assert len(r) > 0
          print('Linker OK, oxshashlik:', r[0]['score'])
          "

      - name: OCR testi
        working-directory: ${{ github.workspace }}
        run: |
          python -c "
          import tempfile, os
          from ocr import extract_text
          with tempfile.NamedTemporaryFile(mode='w', suffix='.txt', delete=False, encoding='utf-8') as f:
              f.write('Soliq qonunchiligi.')
              p = f.name
          t = extract_text(p, 'txt')
          os.unlink(p)
          assert 'Soliq' in t
          print('OCR OK')
          "

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: SSH orqali deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd ~/soliq-bot
            git pull origin main
            pip install -r requirements.txt --quiet --break-system-packages
            sudo systemctl restart soliq-bot || true
            echo "Deploy muvaffaqiyatli!"